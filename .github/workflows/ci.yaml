name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so the cross-platform legs still run during quiet periods.
    - cron: "0 6 * * 1"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --python 3.12
      - name: Lint with ruff
        run: uv run ruff check qjax tests examples
      - name: Check formatting
        # CONTRIBUTING prescribes ruff formatting; without this it was unenforced.
        run: uv run ruff format --check qjax tests examples
      - name: Verify the lockfile is current
        run: uv lock --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --python 3.12
      - name: Type-check with mypy
        run: uv run mypy

  test:
    # Pull requests get the Linux interpreter matrix, which is where a
    # regression almost always shows up first. macOS and Windows are the two
    # slowest legs by a wide margin, so they move to `platforms` below and run
    # after merge rather than on every push to a branch.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      # Coverage instruments every call, so it is measured once rather than on
      # all four legs; the others just run the suite.
      - name: Run tests
        if: matrix.python-version != '3.12'
        run: uv run pytest -n auto
      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: uv run pytest -n auto --cov=qjax --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  platforms:
    # The cross-platform check. Skipped on pull requests, where it roughly
    # doubled wall-clock for a signal that has never differed from Linux; it
    # still gates every merge to main and runs on the weekly schedule.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --python 3.12
      - name: Run tests
        run: uv run pytest -n auto

  core-without-matplotlib:
    # The mathematics must stay importable without the optional plots extra.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install only the runtime dependencies
        run: uv sync --no-dev --python 3.12
      - name: Import and exercise the core API
        run: |
          uv run python -c "
          import importlib.util, sys
          assert importlib.util.find_spec('matplotlib') is None, 'matplotlib should not be installed'
          import qjax, jax.numpy as jnp
          print(qjax.q_log(2.0, 1.5), qjax.tsallis_entmax(jnp.array([1.0, 2.0]), 1.5))
          try:
              import qjax.plots
          except ImportError as exc:
              assert 'qjax[plots]' in str(exc), exc
          else:
              raise AssertionError('importing qjax.plots should have failed')
          "

  examples:
    # The examples are ~1.7k lines that CI never executed. Run the fast ones.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --extra examples --python 3.12
      - name: Run example scripts
        env:
          MPLBACKEND: Agg
        run: |
          set -euo pipefail
          for script in examples/q_gaussian.py examples/learnable_q.py; do
            echo "::group::${script}"
            uv run python "${script}"
            echo "::endgroup::"
          done

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra docs --python 3.12
      - name: Build documentation (warnings as errors)
        # --strict promotes MkDocs warnings to errors: broken internal links,
        # bad anchors, and pages missing from the nav all fail the build.
        run: uv run mkdocs build --strict
