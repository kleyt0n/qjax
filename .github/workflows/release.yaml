name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # The tag is the release trigger, so it is also the release's version claim.
  # Verify it against the source before anything is built or published.
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Check the tag matches the source
        id: version
        run: |
          set -euo pipefail
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(uv run --no-project python -c \
            'import re,pathlib; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("qjax/__init__.py").read_text()).group(1))')"
          echo "tag=${GITHUB_REF_NAME}  tagged=${tagged}  declared=${declared}"
          if [ "${declared}" != "${tagged}" ]; then
            echo "::error::qjax.__version__ is ${declared}, but the tag is ${GITHUB_REF_NAME}. Bump qjax/__init__.py and retag."
            exit 1
          fi
          echo "version=${tagged}" >>"${GITHUB_OUTPUT}"

  ci:
    needs: verify-version
    uses: ./.github/workflows/ci.yaml

  publish:
    needs: [verify-version, ci]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qjax
    permissions:
      # Required for PyPI Trusted Publishing (OIDC) and for the GitHub release.
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build package
        run: uv build
      - name: Check built metadata
        run: uvx twine check dist/*
      - name: Publish to PyPI
        # Trusted Publishing: no long-lived API token in secrets.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
