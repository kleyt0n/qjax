name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.2.0). Must match qjax.__version__."
        required: true
        type: string

permissions:
  contents: read

jobs:
  # The `version` input used to be declared and never referenced, so a release
  # could silently ship whatever was in the tree. Fail fast instead.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Check the requested version matches the source
        run: |
          set -euo pipefail
          declared="$(uv run --no-project python -c \
            'import re,pathlib; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("qjax/__init__.py").read_text()).group(1))')"
          echo "requested=${{ inputs.version }}  declared=${declared}"
          if [ "${declared}" != "${{ inputs.version }}" ]; then
            echo "::error::qjax.__version__ is ${declared}, but the release was requested for ${{ inputs.version }}. Bump qjax/__init__.py first."
            exit 1
          fi
      - name: Check the tag does not already exist
        run: |
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ inputs.version }} already exists."
            exit 1
          fi

  ci:
    needs: verify-version
    uses: ./.github/workflows/ci.yaml

  publish:
    needs: [verify-version, ci]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qjax
    permissions:
      # Required for PyPI Trusted Publishing (OIDC) and for pushing the tag.
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Build package
        run: uv build
      - name: Check built metadata
        run: uvx twine check dist/*
      - name: Publish to PyPI
        # Trusted Publishing: no long-lived API token in secrets.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
      - name: Tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version }}"
          name: "v${{ inputs.version }}"
          generate_release_notes: true
          files: dist/*
