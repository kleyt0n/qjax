[project]
name = "qjax"
version = "0.1.0"
description = "Tsallis statistics for artificial intelligence, built on JAX."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kleyton Costa", email = "kleyton.costa@holisticai.com" }]
keywords = ["tsallis", "jax", "statistics", "entropy", "machine-learning"]
dependencies = [
    "jax>=0.4.30",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "pymdown-extensions>=10.9",
    # mkdocstrings formats the signatures it renders separately with ruff (or
    # black) when one is available, and warns at build time when neither is.
    "ruff>=0.6",
    # mkdocstrings imports the package to read its docstrings, so the optional
    # plotting dependency has to be present for the qjax.plots pages.
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qjax"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"examples/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
